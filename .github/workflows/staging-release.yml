name: Staging release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Git commit SHA to deploy to isolated staging
        required: true

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: incaptta-projects-staging
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_DEPLOYMENT_ENV: staging
      FIREBASE_PROJECT_ID: incaptta-pro-staging
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-staging-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: incaptta-pro-staging.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: incaptta-pro-staging
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: incaptta-pro-staging.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci-staging"
      LEGACY_API_BASE_URL: https://us-central1-incaptta-pro-staging.cloudfunctions.net/api
      ALLOW_REAL_EMAIL: "false"
      ENABLE_SCHEDULED_JOBS: "false"
    steps:
      - name: Pin staging project
        run: |
          test "${{ vars.STAGING_FIREBASE_PROJECT_ID }}" = "incaptta-pro-staging"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project-management-next/package-lock.json

      - name: Install dependencies
        working-directory: project-management-next
        run: npm ci

      - name: Validate staging isolation
        working-directory: project-management-next
        run: npm run check:deployment-config && npm run test:deployment

      - name: Lint
        working-directory: project-management-next
        run: npm run lint:deployment

      - name: Build
        working-directory: project-management-next
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy exact commit to staging
        run: >-
          npx --yes firebase-tools@15.28.1 apphosting:rollouts:create
          "${{ vars.STAGING_APPHOSTING_BACKEND_ID }}"
          --project incaptta-pro-staging
          --git-commit "${{ inputs.commit_sha }}"
          --force

      - name: Verify staging health
        run: |
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 10 "${{ vars.STAGING_BASE_URL }}/api/health")"
          node -e '
            const h = JSON.parse(process.argv[1]);
            const host = String(h.legacyApiHost || "");
            const ok = h.status === "ok"
              && h.environment === "staging"
              && h.firebaseProjectId === "incaptta-pro-staging"
              && h.allowRealEmail === false
              && h.enableScheduledJobs === false
              && host.includes("incaptta-pro-staging");
            if (!ok) process.exit(1);
          ' "$response"

      - name: Mark commit as staging-released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${{ inputs.commit_sha }}" \
            -f state=success \
            -f context=incaptta-staging-release \
            -f description="Deployed and healthy on incaptta-pro-staging"
