# The staging backend must live in a separate Firebase project and have its
# Environment name set to "staging". Firebase merges this over apphosting.yaml.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 1024

env:
  - variable: DEPLOYMENT_ENV
    value: staging
  - variable: NEXT_PUBLIC_DEPLOYMENT_ENV
    value: staging
  - variable: FIREBASE_PROJECT_ID
    value: incaptta-pro-staging
  - variable: GOOGLE_CLOUD_PROJECT
    value: incaptta-pro-staging
  - variable: GCLOUD_PROJECT
    value: incaptta-pro-staging
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyD6Lr2Y7XNoM6SUsKg5pb5PEc1Yv7j4A-w"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: incaptta-pro-staging.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: incaptta-pro-staging
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: incaptta-pro-staging.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "347668381794"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:347668381794:web:d23c6818581d50a7aad13b"
  - variable: LEGACY_API_BASE_URL
    value: https://us-central1-incaptta-pro-staging.cloudfunctions.net/api
  - variable: ALLOW_REAL_EMAIL
    value: "true"
  - variable: RESEND_FROM_EMAIL
    value: "Incaptta <no-reply@deltorkesmak.co.zw>"
  - variable: ENABLE_SCHEDULED_JOBS
    value: "false"
  - variable: GEMINI_API_KEY
    secret: staging-gemini-api-key
    availability:
      - BUILD
      - RUNTIME
  - variable: CRON_SECRET
    secret: staging-cron-secret
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: staging-resend-api-key
    availability:
      - RUNTIME
